<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNow — Products</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">ShopNow</h1>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="about.html">About</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <section class="hero">
    <h2>Explore Our Product Catalogue</h2>
  </section>

  <div style="text-align: center; margin-bottom: 1rem;">
    <input type="text" id="search-box" placeholder="Search products..." style="padding: 0.5rem; width: 300px;">
    <br><br>
    <button class="category-btn" data-category="All">All</button>
    <button class="category-btn" data-category="Computers">Computers</button>
    <button class="category-btn" data-category="Accessories">Accessories</button>
    <button class="category-btn" data-category="Phones">Phones</button>
    <br><br>
    <select id="sort-select" style="padding: 0.5rem;">
        <option value="default">Sort by Price</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
    </select>
  </div>

  <div id="product-list" class="product-grid"></div> 

  <footer class="site-footer"><p>&copy; 2026 ShopNow.</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script> 
</body>
</html>
